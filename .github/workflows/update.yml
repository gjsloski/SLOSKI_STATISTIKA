name: Posodobitev statistike

on:
  schedule:
    - cron: "0 7 * * 0"        # vsako nedeljo ob 07:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly = samo tekoča sezona, backfill = vsa zgodovina od 1991/92"
        default: "weekly"
        type: choice
        options: [weekly, backfill, reset-jumping, reset-alpine, reset-all, refilter, fill-startlists, check, validate, probe]
  push:
    branches: [main]
    paths: [index.html, scripts/**, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: statistika
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Zberi rezultate
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          if [ "$MODE" = "probe" ]; then
            python scripts/update.py --probe "ATH:JP:68518:1992,ATH:JP:21111:1992,ATH:JP:18035:1995,ATH:NK:176006:2027,ATH:NK:217159:2027,JP:812,JP:1823"