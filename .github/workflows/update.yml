name: Posodobitev statistike

on:
  schedule:
    - cron: "0 7 * * 0"        # vsako nedeljo ob 07:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly = samo tekoča sezona, backfill = vsa zgodovina od 1991/92"
        default: "weekly"
        type: choice
        options: [weekly, backfill, reset-jumping, reset-alpine, reset-all, refilter, fill-startlists, check, validate, probe]
  push:
    branches: [main]
    paths: [index.html, scripts/**, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: statistika
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Zberi rezultate
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          if [ "$MODE" = "probe" ]; then
            python scripts/update.py --probe "JP:5330,JP:5247,JP:5441,JP:5442,JP:5273,JP:5571,JP:6839,JP:6941,JP:6942,JP:7719,JP:7508,JP:1823,JP:1822,JP:1321,JP:329,JP:330,JP:331,JP:641,JP:643,JP:812,JP:3652,JP:3684"